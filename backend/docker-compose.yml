# Stack local: Postgres + migrate/seed + API + worker.
# Auth (Better Auth), push fake y telefonía fake van dentro de api/worker.
# No hace falta Redis ni Supabase Auth/Kong.
#
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up --build

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      # Por defecto 54323 para no chocar con Supabase CLI (54322).
      - '${POSTGRES_HOST_PORT:-54323}:5432'
    volumes:
      - guardme_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      # Host interno de Compose (pisa 127.0.0.1 del .env local si se reutiliza).
      DATABASE_URL_MIGRATIONS: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_AUTH: postgresql://guardme_auth:guardme_auth_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_API: postgresql://guardme_api:guardme_api_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_ONBOARDING: postgresql://guardme_onboarding:guardme_onboarding_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_WORKER: postgresql://guardme_worker:guardme_worker_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_INGEST: postgresql://guardme_ingest:guardme_ingest_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      BETTER_AUTH_URL: http://localhost:3000
      DB_HOST: db
      DB_PORT: '5432'
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        'sh',
        '-c',
        'node scripts/wait-for-db.mjs && pnpm exec prisma migrate deploy && pnpm exec prisma db seed',
      ]
    restart: 'on-failure'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL_MIGRATIONS: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_AUTH: postgresql://guardme_auth:guardme_auth_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_API: postgresql://guardme_api:guardme_api_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_ONBOARDING: postgresql://guardme_onboarding:guardme_onboarding_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_WORKER: postgresql://guardme_worker:guardme_worker_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_INGEST: postgresql://guardme_ingest:guardme_ingest_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      BETTER_AUTH_URL: http://localhost:3000
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ['node', 'dist/main.js']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/health/live\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DATABASE_URL_MIGRATIONS: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_AUTH: postgresql://guardme_auth:guardme_auth_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_API: postgresql://guardme_api:guardme_api_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_ONBOARDING: postgresql://guardme_onboarding:guardme_onboarding_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_WORKER: postgresql://guardme_worker:guardme_worker_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      DATABASE_URL_INGEST: postgresql://guardme_ingest:guardme_ingest_dev@db:5432/${POSTGRES_DB:-postgres}?connect_timeout=30
      BETTER_AUTH_URL: http://localhost:3000
      WORKER_ID: guardme-worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ['node', 'dist/worker.main.js']

volumes:
  guardme_pg:
